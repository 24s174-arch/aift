<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이언스 4 시리즈</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Pretendard', sans-serif;
        }

        /* 공통 레이아웃 */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none; /* 기본적으로 숨김 */
        }

        /* --- [1] 메인 화면 (흰색) --- */
        #main-screen {
            display: block; /* 초기 화면 */
            background-color: white;
        }

        /* 로그인 버튼 (오른쪽 끝, 중앙에서 절반 위) */
        .login-btn {
            position: absolute;
            right: 20px;
            top: 25%; /* 중앙(50%)의 절반 위 */
            transform: translateY(-50%);
            background-color: #007bff;
            color: white;
        }

        /* 중앙 버튼 그룹 */
        .center-group {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-green {
            background-color: #28a745;
            color: white;
            min-width: 200px;
        }

        /* --- [2] 서브 화면들 --- */
        .sub-screen {
            padding: 20px;
        }

        /* 뒤로 가기 버튼 (왼쪽 위 끝) */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #28a745;
            color: white;
        }

        /* 버튼 공통 스타일 */
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="main-screen" class="screen">
        <button class="login-btn" onclick="openScreen('grey')">로그인</button>
        
        <div class="center-group">
            <button class="btn-green" onclick="openScreen('grey')">사이언스 4 내신</button>
            <button class="btn-green" onclick="openScreen('black')">사이언스 4 일상</button>
            <button class="btn-green" onclick="openScreen('white-sub')">사이언스 4 생활</button>
        </div>
    </div>

    <div id="sub-screen" class="screen sub-screen">
        <button class="back-btn" onclick="goBack()">뒤로 가기</button>
    </div>

    <script>
        const mainScreen = document.getElementById('main-screen');
        const subScreen = document.getElementById('sub-screen');

        /**
         * 화면 전환 함수
         * @param {string} color - 배경색 결정 키워드
         */
        function openScreen(color) {
            mainScreen.style.display = 'none';
            subScreen.style.display = 'block';

            // 요청하신 조건에 따른 배경색 설정
            if (color === 'grey') {
                subScreen.style.backgroundColor = '#808080';
                subScreen.style.color = 'white'; // 글자색 반전
            } else if (color === 'black') {
                subScreen.style.backgroundColor = '#000000';
                subScreen.style.color = 'white';
            } else if (color === 'white-sub') {
                subScreen.style.backgroundColor = '#ffffff';
                subScreen.style.color = 'black';
            }
        }

        /**
         * 처음 화면으로 돌아가기
         */
        function goBack() {
            subScreen.style.display = 'none';
            mainScreen.style.display = 'block';
        }
    </script>

</body>
</html>
